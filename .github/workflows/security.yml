name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly Monday scan

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL (python, javascript)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: ["python", "javascript-typescript"]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3

  pip-audit:
    name: pip-audit (dependency CVEs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: >
          uv pip install --system pip-audit
          -e "packages/fairness-core"
          -e "services/api[ingestion,agent]"
      - name: Audit installed dependencies (blocking)
        run: |
          # No --strict: fairness-core/ethiclens-api are local, unpublished packages —
          # pip-audit can't resolve them against PyPI, and --strict turns that
          # unresolvability into a hard failure instead of the graceful skip it gets
          # without the flag. This still audits every real (PyPI-sourced) dependency.
          #
          # PYSEC-2026-1325: ecdsa's Minerva timing-attack CVE, pulled in transitively
          # by python-jose[cryptography]'s ES*-algorithm support. This app only ever
          # signs JWTs with HS256 (config.py) — ecdsa.SigningKey.sign_digest() is never
          # called — and ecdsa's maintainers have no planned fix (side-channel attacks
          # are out of scope for that project). Ignored deliberately, not silently.
          pip-audit --ignore-vuln PYSEC-2026-1325
