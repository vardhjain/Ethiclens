name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly Monday scan

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL (python, javascript)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: ["python", "javascript-typescript"]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3

  pip-audit:
    name: pip-audit (dependency CVEs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: >
          uv pip install --system pip-audit
          -e "packages/fairness-core"
          -e "services/api[ingestion,agent]"
      - name: Audit installed dependencies (blocking)
        run: |
          # No --strict: fairness-core/ethiclens-api are local, unpublished packages —
          # pip-audit can't resolve them against PyPI, and --strict turns that
          # unresolvability into a hard failure instead of the graceful skip it gets
          # without the flag. This still audits every real (PyPI-sourced) dependency.
          pip-audit

  npm-audit:
    name: npm audit (dependency CVEs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm install
      - name: Audit production dependencies (blocking)
        run: |
          # --omit=dev: the only current findings are a dev-server-only esbuild CORS
          # advisory (GHSA-67mh-4wv8-2f99) pulled in by vite/vitest — build tooling
          # that never ships in the production bundle. Scoping to production
          # dependencies audits everything that actually reaches users; the vite/
          # esbuild devDependency chain gets a real fix whenever vite 6+ is adopted.
          npm audit --omit=dev
