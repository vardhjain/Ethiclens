name: docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "LIMITATIONS.md", "mkdocs.yml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv pip install --system mkdocs-material
      # --strict: cross-repo links now use absolute GitHub URLs (see LIMITATIONS.md /
      # docs/methodology.md) so the site has no relative links pointing outside docs/ to
      # break; pymdownx.snippets' check_paths also fails the build if the LIMITATIONS.md
      # include ever goes missing.
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
